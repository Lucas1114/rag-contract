# The question set. This file defines what "correct" means for the whole
# project: retrieval quality is measured against these annotations, and the
# CI gate compares its recall to eval/thresholds.yaml.
#
# Passage ids are RFC *section* ids ("rfc9110#9.2.1"), never chunk ids. A
# section parser tags every chunk with the section it came from, and a question
# counts as a hit at k when any chunk in the top k carries an expected section.
# Annotations therefore survive any change to chunk size or overlap.
#
# Fields:
#   id          stable identifier; never reused or renumbered
#   question    the question as asked
#   answerable  true  -> `expected` must be retrieved
#               false -> the service must refuse
#   expected    list of section ids (answerable questions only)
#   note        the fact that answers it, for a reviewer checking by hand
#
# Refusal questions additionally carry:
#   absent          why the corpus does not answer it
#   nearest         sections retrieval is expected to surface anyway; metadata
#                   only, not scored
#   expected_state  which failure state the service must land in
#
# Answerable questions carry no `expected_state`: an answerable question that
# expected anything but `grounded` would be a contradiction in the annotation,
# so the loader rejects one that carries the field at all.
#
# Two deliberate omissions, both to be filled in once the harness has produced
# a real score distribution:
#   - `expected` is a list but currently always holds one section. Multi-passage
#     questions (comparisons such as safe-vs-idempotent) need a `match: all`
#     mode in the scorer; the list shape is here so adding them later needs no
#     migration.
# The second omission has been filled in. `expected_state` now names which
# failure state each refusal question must land in — see the note above the
# refusal block for what the states are and how the boundary was drawn. The
# first omission stands: `expected` is still always one section.

questions:

  # --- RFC 3986: URI generic syntax ---

  - id: q01
    question: "Which characters make up the unreserved set in a URI?"
    answerable: true
    expected: ["rfc3986#2.3"]
    note: "ALPHA, DIGIT, and the four marks - . _ ~"

  - id: q02
    question: "How is a percent-encoded octet written in a URI?"
    answerable: true
    expected: ["rfc3986#2.1"]
    note: "A percent sign followed by two hexadecimal digits."

  - id: q03
    question: "What does a URI fragment identifier identify?"
    answerable: true
    expected: ["rfc3986#3.5"]
    note: "A secondary resource, interpreted relative to the primary resource and its media type."

  # --- RFC 9110: HTTP semantics ---

  - id: q04
    question: "Which HTTP request methods are defined as safe?"
    answerable: true
    expected: ["rfc9110#9.2.1"]
    note: "GET, HEAD, OPTIONS, and TRACE."

  - id: q05
    question: "Which status code means the server knows the request method but the target resource does not support it, and what must that response include?"
    answerable: true
    expected: ["rfc9110#15.5.6"]
    note: "405 Method Not Allowed; the origin server must generate an Allow header field."

  - id: q06
    question: "What distinguishes a strong validator from a weak validator?"
    answerable: true
    expected: ["rfc9110#8.8.1"]
    note: "A strong validator changes whenever the representation data changes; a weak one may stay the same across semantically equivalent changes."

  - id: q07
    question: "What does a Vary header field on a response tell a cache?"
    answerable: true
    expected: ["rfc9110#12.5.5"]
    note: "Which request fields the selection of this representation depended on, so the cache can key on them."

  - id: q08
    question: "How is a quality value in a content negotiation header field interpreted?"
    answerable: true
    expected: ["rfc9110#12.4.2"]
    note: "A weight from 0 to 1 with up to three decimal places; 0 means not acceptable."

  - id: q09
    question: "How does a server indicate that it supports range requests for a resource?"
    answerable: true
    expected: ["rfc9110#14.3"]
    note: "By sending an Accept-Ranges header field naming the range units it supports."

  # --- RFC 9111: HTTP caching ---

  - id: q10
    question: "How does a cache calculate the freshness lifetime of a stored response?"
    answerable: true
    expected: ["rfc9111#4.2.1"]
    note: "First s-maxage (shared caches), then max-age, then Expires minus Date, otherwise heuristic."

  - id: q11
    question: "When may a cache use heuristic freshness?"
    answerable: true
    expected: ["rfc9111#4.2.2"]
    note: "Only when no explicit expiration time is present in the stored response."

  - id: q12
    question: "What does the s-maxage response directive do, and which caches does it apply to?"
    answerable: true
    expected: ["rfc9111#5.2.2.10"]
    note: "Overrides max-age and Expires, for shared caches only."

  - id: q13
    question: "When may a shared cache store a response to a request that carried an Authorization header field?"
    answerable: true
    expected: ["rfc9111#3.5"]
    note: "Only when the response explicitly permits it, via must-revalidate, public, or s-maxage."

  # --- RFC 9112: HTTP/1.1 ---

  - id: q14
    question: "How does a recipient determine the length of a message body in an HTTP/1.1 message?"
    answerable: true
    expected: ["rfc9112#6.3"]
    note: "An ordered list of rules; Transfer-Encoding takes precedence over Content-Length."

  - id: q15
    question: "How is the end of a chunked message body signalled?"
    answerable: true
    expected: ["rfc9112#7.1"]
    note: "By a chunk with a size of zero, followed by the trailer section and an empty line."

  - id: q16
    question: "Which request-target form is used for a CONNECT request?"
    answerable: true
    expected: ["rfc9112#3.2.3"]
    note: "authority-form: host and port only, no scheme or path."

  # --- RFC 6265: cookies ---

  - id: q17
    question: "What effect does the HttpOnly attribute have on a cookie?"
    answerable: true
    expected: ["rfc6265#5.2.6"]
    note: "Restricts the cookie to HTTP requests, keeping it out of non-HTTP APIs such as scripts."

  - id: q18
    question: "How is domain matching defined for cookies?"
    answerable: true
    expected: ["rfc6265#5.1.3"]
    note: "Identical strings, or the domain is a suffix of the host at a dot boundary and the host is not an IP address."

  - id: q19
    question: "What minimum size per cookie should a user agent support?"
    answerable: true
    expected: ["rfc6265#6.1"]
    note: "At least 4096 bytes for name, value and attributes combined."

  # --- RFC 8259: JSON ---

  - id: q20
    question: "What are the six structural characters in JSON?"
    answerable: true
    expected: ["rfc8259#2"]
    note: "Left and right square bracket, left and right curly bracket, colon, comma."

  # --- Refusal path: no answer in this corpus ---
  #
  # `expected_state` is guarantee 3's annotation, and the states are decided by
  # the grounding check rather than by a score:
  #
  #   grounded      every claim was traced to the passage it cited
  #   partial       some claims were; the rest were withdrawn and named
  #   unsupported   none were; the service refuses and says what it consulted
  #   no_context    nothing was retrieved at all
  #
  # The boundary between `partial` and `unsupported` is whether the corpus
  # holds a true, relevant, groundable statement that stops short of the
  # answer. u01, u03 and u07 do: RFC 9110 Section 1.2 says HTTP/2 multiplexes
  # and never says how, RFC 9112 Section 9.7 has a client sending a ClientHello
  # and no handshake, RFC 6265 defines six attributes that restrict when a
  # cookie is sent and SameSite is not among them. Those are the dangerous
  # questions: retrieval surfaces a real passage at an ordinary score, and a
  # drafter reading it supplies the rest from memory. The other five have no
  # foothold in the corpus at all.
  #
  # This is a specification, not a prediction. What the gate pins absolutely is
  # that none of these eight may come back `grounded` — a question the corpus
  # cannot answer must never produce a confident answer. The partial/
  # unsupported split is gated more loosely, because whether a foothold
  # passage lands inside the retrieval window can legitimately move with the
  # chunk parameters.
  #
  # `no_context` is annotated on no question here, and saying so is more honest
  # than manufacturing one. Brute-force cosine over 868 chunks always returns
  # ten, so no question against this corpus can reach that state; it is the
  # defined behaviour when the index is unavailable, which is where P04 and the
  # index cutover of guarantee 4 meet. It is held by unit tests, not by this
  # file.

  - id: u01
    question: "How does HTTP/2 multiplex multiple requests over a single TCP connection?"
    answerable: false
    expected_state: partial
    state_reason: >-
      RFC 9110 Section 1.2 states that HTTP/2 introduced a multiplexed
      session layer. That grounds; streams, frames and flow control do not.
    absent: >-
      HTTP/2 is RFC 9113, not in the corpus. RFC 9110 Section 1.2 notes in
      passing that HTTP/2 introduced a multiplexed session layer, but describes
      no streams, frames or flow control: it states the fact without answering
      how. Retrieval is expected to rank that passage highly regardless, which
      makes this a test of grounding rather than of similarity.
    nearest: ["rfc9110#1.2", "rfc9112#9.3", "rfc9112#9.4"]

  - id: u02
    question: "What fields does an HTTP/2 HEADERS frame contain?"
    answerable: false
    expected_state: unsupported
    state_reason: >-
      Nothing retrieved mentions a frame of any kind. Every claim about
      HEADERS fields cites a passage that does not contain it.
    absent: "HTTP/2 frame layout is RFC 9113, which is not in the corpus."
    nearest: []

  - id: u03
    question: "How does the SameSite cookie attribute restrict cross-site requests?"
    answerable: false
    expected_state: partial
    state_reason: >-
      The six attributes that restrict when a cookie is sent are in the
      corpus and ground. SameSite is not one of them, and no claim naming it
      can.
    absent: "SameSite was introduced after RFC 6265; the corpus has the original six attributes only."
    nearest: ["rfc6265#5.2.5", "rfc6265#5.4"]

  - id: u04
    question: "What grant types does OAuth 2.0 define?"
    answerable: false
    expected_state: unsupported
    state_reason: >-
      The generic authentication framework is retrieved, but a grant type
      has no counterpart in it. Nothing about the question grounds.
    absent: "OAuth 2.0 is RFC 6749; the corpus carries only the generic HTTP authentication framework."
    nearest: ["rfc9110#11.1", "rfc9110#11.3"]

  - id: u05
    question: "How is the signature of a JSON Web Token computed?"
    answerable: false
    expected_state: unsupported
    state_reason: >-
      Retrieval returns the JSON grammar. The corpus has no signature, key
      or token material to ground a claim against.
    absent: "JWT and JWS are RFCs 7519 and 7515; the corpus has the JSON grammar but no token format."
    nearest: ["rfc8259#7", "rfc9110#11.4"]

  - id: u06
    question: "What resource records does a DNS server return for an A-record query?"
    answerable: false
    expected_state: unsupported
    state_reason: >-
      A different layer entirely. Nothing retrieved is about name
      resolution.
    absent: "DNS is RFC 1035, a different layer entirely."
    nearest: []

  - id: u07
    question: "What is the message sequence of the TLS 1.3 handshake?"
    answerable: false
    expected_state: partial
    state_reason: >-
      RFC 9112 Section 9.7 has a client sending a ClientHello to begin the
      handshake. That grounds; the message sequence does not.
    absent: >-
      TLS 1.3 is RFC 8446, not in the corpus. RFC 9112 Section 9.7 mentions
      sending a ClientHello to begin the handshake, but gives no message
      sequence.
    nearest: ["rfc9112#9.7", "rfc9110#4.3.4"]

  - id: u08
    question: "How does a browser decide whether to send a CORS preflight request?"
    answerable: false
    expected_state: unsupported
    state_reason: >-
      Retrieval lands on conditional-request preconditions, a false friend
      of 'preflight'. No claim about CORS grounds against them.
    absent: "CORS is the WHATWG Fetch standard, not an RFC, and is not in the corpus."
    nearest: ["rfc9110#9.3.7", "rfc9110#7.8"]
