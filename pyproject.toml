[project]
name = "rag-contract"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Lucas1114", email = "94253213+Lucas1114@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
rag-contract = "rag_contract.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
